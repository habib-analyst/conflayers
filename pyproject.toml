[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conflayers"
version = "0.1.0"
description = "The confidence compiler: neural networks whose native data type is a guaranteed prediction set"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Habib Ur Rehman" }]
keywords = ["conformal-prediction", "uncertainty-quantification", "neural-networks", "medical-imaging"]
dependencies = ["torch>=2.0", "numpy>=1.24"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/habib-analyst/conflayers"

[tool.setuptools.packages.find]
where = ["src"]
